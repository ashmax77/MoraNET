# CampusNet NIO - Server Configuration
# All keys have hard-coded defaults in the reading code (config.getInt(key, default)).
# A missing key here never crashes any service.
# Owner: M1 consolidates this file at milestone I4.
# Format: key=value  (#comment)

# ---------------------------------------------------------------------------
# Chat server (M1)
# ---------------------------------------------------------------------------
chat.port=5000
chat.maxConnections=1000
chat.authTimeoutSec=30
chat.idleTimeoutSec=120
chat.maxOutboundBytes=262144

# ---------------------------------------------------------------------------
# File server (M4)
# ---------------------------------------------------------------------------
file.port=5001
file.storageDir=storage
file.maxBytes=52428800
file.idleTimeoutSec=30

# ---------------------------------------------------------------------------
# UDP discovery (M3)
# ---------------------------------------------------------------------------
discovery.port=8888

# ---------------------------------------------------------------------------
# Web dashboard (HTTP/SSE)
# ---------------------------------------------------------------------------
dashboard.port=8080

# ---------------------------------------------------------------------------
# Tokens (M5)
# ---------------------------------------------------------------------------
token.ttlSec=60

# ---------------------------------------------------------------------------
# Demo users — format: user.<name>=<password>,<ROLE>
# Roles: STUDENT, LECTURER, EXTERNAL   (M5)
# ---------------------------------------------------------------------------
user.alice=pw1,STUDENT
user.bob=pw2,LECTURER
user.partner=pw3,EXTERNAL
