name: ci

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target build -t moranet-build .

      - name: Build and test
        run: docker run --rm moranet-build mvn -B verify
